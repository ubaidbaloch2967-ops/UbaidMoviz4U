<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubaid Moviz4U</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
body::before{content:"";position:absolute;width:150%;height:150%;background:radial-gradient(ellipse at 30% 50%, #ff1a001a 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, #ff6a0026 0%, transparent 60%);animation:bgMove 8s ease-in-out infinite alternate}
@keyframes bgMove{0%{transform:translate(-5%, -5%) rotate(0deg)}100%{transform:translate(5%, 5%) rotate(3deg)}}
.light{position:absolute;top:50%;left:-20%;width:140%;height:3px;background:linear-gradient(90deg, transparent, #ff3300, #ff9900, #ff3300, transparent);filter:blur(1px);box-shadow:0 0 20px #ff3300, 0 0 40px #ff6600;transform:rotate(-8deg);animation:lightMove 4s linear infinite}
.light2{top:55%;animation-delay:1s;transform:rotate(-5deg);opacity:0.7}
.light3{top:45%;animation-delay:2s;transform:rotate(-12deg);opacity:0.5}
@keyframes lightMove{0%{transform:translateX(-30%) rotate(-8deg)}100%{transform:translateX(30%) rotate(-8deg)}}
.content{position:relative;z-index:10;text-align:center;padding:20px}
h1{font-size:68px;font-weight:900;line-height:0.9;letter-spacing:2px}
h1 .u{color:#ff2a00;text-shadow:0 0 15px #ff2a00, 0 0 30px #ff2a00}
h1 .m{color:#ffcc00;text-shadow:0 0 15px #ffcc00, 0 0 30px #ffaa00;font-size:52px;margin-top:8px;display:block}
p{margin-top:18px;font-size:17px;opacity:0.9;letter-spacing:1px}
.btn{display:block;width:280px;margin:22px auto 0;padding:14px 20px;border-radius:40px;text-decoration:none;font-weight:700;font-size:17px;transition:0.3s}
.btn-owner{border:2px solid #00e6ff;color:#00e6ff;box-shadow:0 0 15px #00e6ff33}
.btn-owner:hover{background:#00e6ff;color:#000;box-shadow:0 0 30px #00e6ff}
.btn-movies{border:2px solid #ffaa00;color:#ffaa00;box-shadow:0 0 15px #ffaa0033}
.btn-movies:hover{background:#ffaa00;color:#000;box-shadow:0 0 30px #ffaa00}
</style>
</head>
<body>
<div class="light"></div>
<div class="light light2"></div>
<div class="light light3"></div>

<div class="content">
<h1><span class="u">UBAID</span> <span class="m">MOVIZ4U</span></h1>
<p>Open Website and Enjoy Movies 🍿🎥</p>

<a class="btn btn-owner" href="Ubaid.html">Website Owner 👑</a>
<a class="btn btn-movies" href="Movies.html">Explore Trending Movies</a>
</div>
</body>
</html>
